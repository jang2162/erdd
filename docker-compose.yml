services:
  db:
    image: postgres:17
    environment:
      # 기본값은 종전과 같은 erdd 다 — .env 로 덮어쓸 수 있게만 열어 뒀다.
      # ⚠️ 이 값은 데이터 디렉터리를 **처음 초기화할 때만** 반영된다. pgdata 볼륨이 이미
      # 있으면 값을 바꿔도 실제 비밀번호는 그대로다(실측 확인). 운영 설치라면 첫 기동 전에 정한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erdd}
      POSTGRES_DB: erdd
    ports:
      # 호스트의 루프백에만 붙는다 — 호스트에서 psql·마이그레이션을 붙이는 데는 이것으로 충분하고,
      # 앱은 compose 네트워크로 붙으므로 공개할 필요가 없다. Docker 가 공개한 포트는 호스트
      # 방화벽(ufw 등)을 우회하므로 막아 두는 쪽이 기본이다. 외부에 열어야 하면 이 줄을 고친다.
      - "127.0.0.1:${ERDD_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 이 중요하다. 초기화 중에는 엔트리포인트가 임시 서버를 listen_addresses=''
      # 로 띄우므로 TCP 가 열리지 않는다 — 유닉스 소켓으로 검사하면 POSTGRES_DB 가 만들어지기
      # 전에 "준비됨" 으로 보고해서 앱이 너무 일찍 붙는다.
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "erdd", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 스키마 마이그레이션을 한 번 돌고 끝나는 서비스. 서버는 기동 시 마이그레이션하지 않으므로
  # 이 서비스가 app 앞에서 그 몫을 한다 — app 은 이것이 0 으로 끝나야 뜬다.
  # 적용할 것이 없으면 아무것도 하지 않고 끝나므로 매 `up` 마다 돌아도 무해하다.
  migrate:
    # app 과 같은 Dockerfile·컨텍스트로 빌드한다. ⚠️ 한쪽만 빌드하지 않는다(`docker compose build app`) —
    # migrate 가 옛 이미지로 남아 새 마이그레이션을 모른 채 0 으로 끝나고, 새 app 은 스키마 없이 뜬다.
    # 빌드는 `up -d --build`·`docker compose build` 처럼 서비스를 지정하지 않고 함께 돌린다.
    # image: 이름을 붙이지 않는 것은 의도다. 붙이면 `docker compose pull`(관리 도구가 배포 전에
    # 부를 수 있다)이 빌드 전의 그 이름을 레지스트리에서 찾다가 실패한다.
    build: .
    command: ["pnpm", "--filter", "@erdd/server", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # app 과 같은 값이어야 한다 — 다르면 앱이 쓰지 않는 DB 에 마이그레이션하고 끝난다.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-erdd}@db:5432/erdd
    restart: "no"

  # ERDD 서버 한 프로세스가 tRPC API · 웹 정적 파일 · /ws 를 전부 서빙한다.
  # `docker compose up -d --build` 한 번이 빌드 → migrate → 이 서비스 기동까지 간다.
  # DB 만 띄우려면 `docker compose up -d db`.
  app:
    build: .
    depends_on:
      db:
        # DB 가 healthy 가 된 뒤에 뜬다. 서버는 기동 중 DB 를 조회하므로(부트스트랩·시드)
        # 그냥 순서만 맞추면 첫 기동에서 죽고 restart 로만 복구된다.
        condition: service_healthy
      migrate:
        # 스키마가 없으면 서버가 기동 중 조회에서 죽는다. migrate 가 실패하면 앱은 뜨지 않는다.
        condition: service_completed_successfully
    environment:
      # compose 네트워크 안에서 Postgres 의 호스트명은 `db` 다.
      # .env 의 DATABASE_URL(localhost)은 호스트에서 psql 등을 붙일 때 쓰는 값이라
      # 여기에 끌어다 쓰면 안 된다 — 컨테이너 안에서 localhost 는 자기 자신이다.
      # 비밀번호에 @ : / # ? 가 들어가면 URL 이 깨진다. 퍼센트 인코딩하거나 그런 문자를 피한다.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-erdd}@db:5432/erdd
      # 세션 쿠키의 Secure 속성이 이 값 하나로 결정된다(apps/server/src/routers/auth.ts).
      # production 이 아니면 Secure 가 빠져 평문 HTTP 에서도 로그인이 된다 — TLS 없이
      # 시험할 때만 .env 에 ERDD_NODE_ENV=development 를 둔다. 운영에서는 건드리지 않는다.
      # 변수 이름을 NODE_ENV 로 두지 않은 것은 의도다: 그러면 운영자 셸에 우연히 남아 있는
      # NODE_ENV 가 그대로 흘러들어 Secure 가 조용히 꺼진다.
      NODE_ENV: ${ERDD_NODE_ENV:-production}
      # 최초 관리자 부트스트랩. 값은 같은 디렉터리의 .env 에서 온다(저장소에 커밋되지 않는다).
      # 둘 중 하나라도 비어 있으면 부트스트랩은 통째로 건너뛴다.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      # 리버스 프록시 뒤에 둘 때는 ERDD_PORT=127.0.0.1:3000 처럼 호스트 주소를 붙여 준다 —
      # "127.0.0.1:3000:3000" 으로 펼쳐져 루프백에만 붙는다.
      - "${ERDD_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      # 이미지에 curl·wget 이 없다. Node 22 의 전역 fetch 를 쓴다.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/trpc/health.ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
